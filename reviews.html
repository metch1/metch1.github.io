<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title -->
    <title>MetcHI | Client Reviews</title>

    <!-- SEO -->
    <meta name="description"
        content="Read genuine client reviews and testimonials about MetcHI’s design and video editing services.">
    <meta name="author" content="MetcHI">
    <link rel="canonical" href="https://metch1.github.io/reviews.html">
    <meta name="robots" content="index, follow">

    <!-- Open Graph (Discord / WhatsApp / Facebook) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MetcHI Portfolio">
    <meta property="og:title" content="MetcHI | Client Reviews">
    <meta property="og:description"
        content="Client testimonials and feedback on MetcHI’s design and video editing work.">
    <meta property="og:url" content="https://metch1.github.io/reviews.html">
    <meta property="og:image" content="https://i.imgur.com/hyeVGcF.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Client reviews for MetcHI – designer & video editor">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MetcHI | Client Reviews">
    <meta name="twitter:description"
        content="Real client feedback and testimonials for MetcHI’s creative services.">
    <meta name="twitter:image" content="https://i.imgur.com/hyeVGcF.png">
    <meta name="twitter:site" content="@mettchi">

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico">

    <!-- Styles -->
   <link rel="stylesheet" id="theme-style" href="CSS/style.css">


    <link rel="preload" href="CSS/portfolio.css" as="style">
    <link rel="stylesheet" href="CSS/portfolio.css">

    <link rel="preload" href="CSS/review_remake.css" as="style">
    <link rel="stylesheet" href="CSS/review_remake.css">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Theme -->
    <meta name="theme-color" content="#00abf0">

    <!-- Structured Data (WebPage) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "MetcHI Client Reviews",
        "url": "https://metch1.github.io/reviews.html",
        "description": "Client testimonials and reviews for MetcHI’s design and video editing services.",
        "isPartOf": {
            "@type": "WebSite",
            "name": "MetcHI Portfolio",
            "url": "https://metch1.github.io/"
        }
    }
    </script>
</head>


<body>

<header class="header">
    <a href="index.html" class="logo">MetcHi</a>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#services">Services</a>
        <a href="portfolio.html" class="active">Portfolio</a>
        <a href="index.html#contact">Contact</a>
    </nav>

    <div class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
    </div>
</header>

<main class="tempthing">

    <!-- HERO -->
    <section class="portfolio-hero">
        <div class="container">
            <h1>My Rate</h1>
            <p>A collection of my clients reviews</p>
        </div>
    </section>

    <!-- REVIEWS -->
    <section class="portfolio-rev">
        <div class="review-container">
            <!-- Reviews loaded from reviews.json -->
        </div>
    </section>

    <!-- LEAVE REVIEW -->
    <section class="leave-thought">
        <h2>Leave a Review</h2>

        <form id="reviewForm">
            <input
                type="text"
                id="name"
                placeholder="Your name (not the real)"
                required
            >

            <input
                type="url"
                id="avatar"
                placeholder="Avatar URL (optional)"
                value="https://imgur.com/3Cg3Rrp"
            >

            <textarea
                id="message"
                placeholder="Write your review..."
                required
            ></textarea>

            <button type="submit">Send Review</button>
        </form>

        <p id="status"></p>
    </section>

    <!-- REVIEW POPUP -->
    <div class="review-popup" id="reviewPopup">
        <div class="popup-card">
            <button class="popup-close">&times;</button>

            <img id="popupPfp" src="" alt="">
            <h3 id="popupName"></h3>
            <p id="popupBio"></p>

            <div class="popup-socials" id="popupSocials"></div>
        </div>
    </div>

</main>

<footer class="footer">
    <div class="container">
        <p>&copy; 2026 MetcHi. All rights reserved.</p>
    </div>
</footer>

<!-- Scripts -->
<script src="script.js"></script>
<script src="portfolio.js"></script>
<script src="prevent.js"></script>
<script src="cloudflare_worker.js"></script>
<script src="reviews-popup.js"></script>
<script src="reviews.js"></script>

</body>
</html>
