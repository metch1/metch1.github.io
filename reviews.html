<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MetcHI | Portfolio</title>
    <meta name="description" content="Showcasing my design and video editing work">

    <!-- Open Graph -->
    <meta property="og:title" content="MetcHI | Portfolio">
    <meta property="og:description" content="A collection of my clients reviews">
    <meta property="og:image" content="https://imgur.com/a/Q3b86jo">

    <!-- Styles -->
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/portfolio.css">
    <link rel="stylesheet" href="CSS/review_remake.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">MetcHi</a>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#services">Services</a>
        <a href="portfolio.html" class="active">Portfolio</a>
        <a href="index.html#contact">Contact</a>
    </nav>

    <div class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
    </div>
</header>

<main class="tempthing">

    <!-- HERO -->
    <section class="portfolio-hero">
        <div class="container">
            <h1>My Rate</h1>
            <p>A collection of my clients reviews</p>
        </div>
    </section>

    <!-- REVIEWS -->
    <section class="portfolio-rev">
        <div class="review-container">
            <!-- Reviews loaded from reviews.json -->
        </div>
    </section>

    <!-- LEAVE REVIEW -->
    <section class="leave-thought">
        <h2>Leave a Review</h2>

        <form id="reviewForm">
            <input
                type="text"
                id="name"
                placeholder="Your name (not the real)"
                required
            >

            <input
                type="url"
                id="avatar"
                placeholder="Avatar URL (optional)"
                value="https://imgur.com/3Cg3Rrp"
            >

            <textarea
                id="message"
                placeholder="Write your review..."
                required
            ></textarea>

            <button type="submit">Send Review</button>
        </form>

        <p id="status"></p>
    </section>

    <!-- REVIEW POPUP -->
    <div class="review-popup" id="reviewPopup">
        <div class="popup-card">
            <button class="popup-close">&times;</button>

            <img id="popupPfp" src="" alt="">
            <h3 id="popupName"></h3>
            <p id="popupBio"></p>

            <div class="popup-socials" id="popupSocials"></div>
        </div>
    </div>

</main>

<footer class="footer">
    <div class="container">
        <p>&copy; 2026 MetcHi. All rights reserved.</p>
    </div>
</footer>

<!-- Scripts -->
<script src="script.js"></script>
<script src="portfolio.js"></script>
<script src="prevent.js"></script>
<script src="cloudflare_worker.js"></script>
<script src="reviews-popup.js"></script>
<script src="reviews.js"></script>

</body>
</html>
